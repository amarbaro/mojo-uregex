name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write   # the badge step pushes the orphan `badges` branch (main pushes only)
jobs:
  ci:
    uses: amarbaro/mojo-libs/.github/workflows/lib-ci.yml@v1
    with:
      pre: "uv sync || { echo \"FAIL setup: uv sync\"; exit 1; }"
